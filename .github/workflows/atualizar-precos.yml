name: Atualizar precos
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar CSV
        run: python atualizar_precos.py
      - name: Commit se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos.csv
          git diff --cached --quiet || git commit -m "Atualizacao semanal de precos"
          git push
